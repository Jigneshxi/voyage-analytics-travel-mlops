apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-flight-price-api
  namespace: default
  labels:
    app: voyage-flight-price-api
    tier: inference
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voyage-flight-price-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voyage-flight-price-api
    spec:
      containers:
      - name: flask-inference-container
        image: voyageanalytics/flight-price-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: voyage-app-config
              key: ENVIRONMENT
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
